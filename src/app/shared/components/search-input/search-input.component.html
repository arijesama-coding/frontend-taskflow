<mat-form-field appearance="outline" class="search-field">
  <mat-icon matPrefix>search</mat-icon>
  <input
    matInput
    [placeholder]="placeholder"
    (input)="onSearch($event)">
  <button
    *ngIf="searchValue"
    matSuffix
    mat-icon-button
    (click)="clearSearch()">
    <mat-icon>close</mat-icon>
  </button>
</mat-form-field>
