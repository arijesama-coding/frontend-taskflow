<div class="task-board-page animate-fade-in-up">
  <app-page-header
    title="Task Board"
    subtitle="Manage your tasks with drag and drop">
    <div header-actions>
      <button mat-raised-button color="primary" (click)="openTaskDialog()">
        <mat-icon>add</mat-icon>
        New Task
      </button>
    </div>
  </app-page-header>

  <!-- Filter Bar -->
  <app-filter-bar
    [filters]="taskFilters"
    [activeFilters]="activeFilters"
    [searchPlaceholder]="'Search tasks...'"
    (onSearch)="onSearch($event)"
    (onFilterChange)="onFilterChange($event)">
  </app-filter-bar>

  <!-- Kanban Board -->
  <div class="kanban-board" cdkDropListGroup>
    <div
      *ngFor="let column of columns"
      class="kanban-column"
      [ngClass]="column.key.toLowerCase().replace('_', '-')">

      <!-- Column Header -->
      <div class="column-header">
        <div class="column-title">
          <app-status-badge [status]="column.key" type="task"></app-status-badge>
          <span class="task-count">{{ getColumnTasks(column.key).length }}</span>
        </div>
        <button mat-icon-button [matMenuTriggerFor]="columnMenu">
          <mat-icon>more_vert</mat-icon>
        </button>
      </div>

      <!-- Task List -->
      <div
        cdkDropList
        [cdkDropListData]="getColumnTasks(column.key)"
        [cdkDropListConnectedTo]="connectedLists"
        (cdkDropListDropped)="onDrop($event, column.key)"
        class="task-list">

        <app-task-card
          *ngFor="let task of getColumnTasks(column.key)"
          [task]="task"
          (onEdit)="editTask(task)"
          (onDelete)="deleteTask(task)"
          (onClick)="viewTask(task)">
        </app-task-card>

        <!-- Empty Column State -->
        <div *ngIf="getColumnTasks(column.key).length === 0" class="empty-column">
          <p>No tasks</p>
        </div>
      </div>
    </div>
  </div>
</div>
